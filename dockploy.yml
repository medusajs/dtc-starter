# Dockploy Deployment Configuration
# https://dockploy.com/docs

project:
  name: medusa-dtc-starter
  description: Medusa V2 DTC Starter - E-commerce platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: medusa_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=medusa-store
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - target: 5432
        published: 5432
        protocol: tcp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on: []

  redis:
    image: redis:7-alpine
    container_name: medusa_redis
    restart: unless-stopped
    ports:
      - target: 6379
        published: 6379
        protocol: tcp
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on: []

  medusa:
    image: ghcr.io/shubashbiswas/dtc-starter-backend:latest
    container_name: medusa_backend
    restart: unless-stopped
    ports:
      - target: 9000
        published: 9000
        protocol: tcp
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/medusa-store
      - DATABASE_SSL=false
      - REDIS_URL=redis://redis:6379
      - CACHE_REDIS_URL=redis://redis:6379
      - LOCKING_REDIS_URL=redis://redis:6379
      - STORE_CORS=http://localhost:8000
      - ADMIN_CORS=http://localhost:9000
      - AUTH_CORS=http://localhost:9000
      - JWT_SECRET=supersecret
      - COOKIE_SECRET=supersecret
      - MEDUSA_WORKER_MODE=server
      - MEDUSA_SEED=true
      - PORT=9000
      - MEDUSA_BACKEND_URL=http://localhost:9000
    volumes:
      - backend_data:/server/apps/backend/uploads
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  storefront:
    image: ghcr.io/shubashbiswas/dtc-starter-storefront:latest
    container_name: medusa_storefront
    restart: unless-stopped
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_MEDUSA_BACKEND_URL=http://medusa:9000
      - NEXT_PUBLIC_DEFAULT_REGION=dk
      - NEXT_PUBLIC_BASE_URL=http://localhost:8000
    depends_on:
      - medusa

volumes:
  postgres_data:
    driver: local
  backend_data:
    driver: local